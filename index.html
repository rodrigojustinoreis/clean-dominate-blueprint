<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- title, description, og:title, og:description, og:url, twitter tags are set per-page via react-helmet-async -->
    <title>Eco-Friendly House Cleaning MD, DC &amp; VA | Capital Clean Care</title>
    <meta name="author" content="Capital Clean Care" />
    <!-- robots is set per-page via the useSEO hook (src/hooks/useSEO.ts) so that noindex
         pages do not inherit a conflicting "index,follow" default. No static robots here. -->

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Non-blocking font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" /></noscript>

    <!-- og:image + twitter:image are emitted per-page via react-helmet-async (useSEO), so the
         effective (prerendered) image is always the page's own — with a site-wide default fallback.
         Kept here: only tags whose value is identical on every page. -->
    <meta property="og:site_name" content="Capital Clean Care" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@capitalcleancare" />
    <meta name="twitter:creator" content="@capitalcleancare" />
    <!-- Site-verification meta tags removed: they shipped as literal REPLACE_WITH_* placeholders
         (verifying nothing). Add real tokens here if/when meta-tag verification is needed; GSC is
         already verified via another method. -->

    <!-- Geo targeting -->
    <meta name="geo.region" content="US-MD" />
    <meta name="geo.placename" content="Silver Spring" />
    <meta name="geo.position" content="39.08;-77.02" />
    <meta name="ICBM" content="39.08, -77.02" />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#1B3A2D" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Analytics 4 + Google Ads — unified tag -->
    <!-- gtag.js (179KB) deferred until after load+idle: dataLayer queues everything
         meanwhile, so no events are lost — keeps analytics/Ads intact while freeing
         the critical path on mobile (LCP/TBT). -->
    <script>
      window.addEventListener('load', function () {
        setTimeout(function () {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-5NQK4RH08J';
          document.head.appendChild(s);
        }, 2000);
      });
    </script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-5NQK4RH08J');
      gtag('config', 'AW-16450100951');
      gtag('config', 'AW-16450100951/fTKDCKSQjKQcENe9gqQ9', {
        'phone_conversion_number': '(240) 704-2551'
      });
    </script>
  </head>

  <body>
    <!-- Hidden form for Netlify Forms detection at build time -->
    <form name="quote" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="zip" />
      <input type="text" name="service" />
      <input type="text" name="bedrooms" />
      <input type="text" name="bathrooms" />
      <input type="text" name="frequency" />
      <input type="text" name="preferred_date" />
      <textarea name="message"></textarea>
    </form>

    <!-- Hidden form for careers/job applications (Netlify Forms detection) -->
    <form name="careers" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="city" />
      <input type="text" name="position" />
      <input type="text" name="availability" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
