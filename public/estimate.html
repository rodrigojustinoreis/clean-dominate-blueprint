<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- Private client estimates: never index, never follow. -->
<meta name="robots" content="noindex, nofollow" />
<title>Your Estimate · Capital Clean &amp; Care</title>
<style>
  :root{
    --navy:#0D2B5E; --blue:#1A6BAD; --lightblue:#4AACE8;
    --orange:#F0A500; --gray:#666; --bg:#EBF3FB; --white:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:#1b2733; line-height:1.5;
    padding:0 0 40px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:600px;margin:0 auto}
  /* ── Header ── */
  .topstripe{height:6px;background:var(--orange)}
  header{background:var(--navy);color:#fff;padding:20px 20px 22px}
  .brandrow{display:flex;align-items:center;gap:13px}
  .logo{flex:0 0 auto;width:46px;height:46px}
  .brandtext{flex:1 1 auto;min-width:0}
  .brandname{font-size:19px;font-weight:800;letter-spacing:.5px;line-height:1.15}
  .brandsub{font-size:10px;letter-spacing:2px;color:var(--lightblue);text-transform:uppercase;margin-top:2px;font-weight:600}
  .tagline{font-style:italic;font-size:13px;color:#c9dcf1;margin-top:9px}
  .badge{
    display:inline-block;background:var(--orange);color:#3a2600;font-weight:800;
    font-size:11px;letter-spacing:2px;padding:5px 12px;border-radius:6px;margin-top:14px;text-transform:uppercase;
  }
  /* ── Client block ── */
  .client{background:var(--white);padding:22px 20px;border-bottom:1px solid #dbe7f4}
  .client .to{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);font-weight:700}
  .client .name{font-size:22px;font-weight:800;color:var(--navy);margin-top:3px}
  .client .addr{color:var(--gray);font-size:14px;margin-top:4px}
  .client .service{
    margin-top:14px;display:inline-block;background:var(--bg);color:var(--blue);
    font-weight:700;font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid #cfe2f4;
  }
  /* ── Total box ── */
  .total{background:var(--navy);color:#fff;margin:0;padding:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
  .total .lbl{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#a9c4e4;font-weight:700}
  .total .val{font-size:34px;font-weight:800;color:var(--orange);line-height:1}
  /* ── Sections / accordion ── */
  .sections{padding:8px 14px 4px}
  .sechead{padding:16px 6px 8px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);font-weight:700}
  .acc{border:1px solid #d6e4f3;border-radius:12px;background:#fff;margin:10px 0;overflow:hidden;box-shadow:0 1px 2px rgba(13,43,94,.05)}
  .acc-btn{
    width:100%;text-align:left;background:none;border:0;cursor:pointer;
    padding:16px 18px;font-size:16px;font-weight:700;color:var(--navy);
    display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:inherit;
  }
  .acc-btn:hover{background:#f7fbff}
  .acc-btn .chev{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--bg);color:var(--blue);display:flex;align-items:center;justify-content:center;transition:transform .25s ease;font-size:13px;font-weight:800}
  .acc.open .acc-btn .chev{transform:rotate(180deg);background:var(--orange);color:#fff}
  .acc-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .acc.open .acc-body{max-height:1200px}
  .acc-inner{padding:4px 18px 18px}
  .item{display:flex;align-items:flex-start;gap:11px;padding:7px 0;font-size:15px;color:#26364a}
  .check{flex:0 0 auto;width:20px;height:20px;border-radius:5px;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;margin-top:1px}
  /* ── Trust chips ── */
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 20px 4px}
  .chip{background:#fff;border:1px solid #cfe2f4;color:var(--blue);font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:20px;display:flex;align-items:center;gap:6px}
  .chip .dot{width:8px;height:8px;border-radius:50%;background:var(--lightblue)}
  /* ── Buttons ── */
  .actions{padding:18px 20px 8px;display:flex;flex-direction:column;gap:11px}
  .btn{display:flex;align-items:center;justify-content:center;gap:9px;padding:16px;border-radius:12px;font-size:16px;font-weight:800;text-decoration:none;font-family:inherit;border:0;cursor:pointer}
  .btn-primary{background:var(--orange);color:#3a2600;box-shadow:0 4px 14px rgba(240,165,0,.35)}
  .btn-primary:active{transform:translateY(1px)}
  .btn-secondary{background:#fff;color:var(--navy);border:2px solid var(--navy)}
  .fineprint{text-align:center;color:var(--gray);font-size:12px;padding:6px 24px 0}
  /* ── Footer ── */
  footer{background:var(--navy);color:#c9dcf1;margin-top:22px;padding:22px 20px;text-align:center;font-size:12.5px}
  footer .fbrand{color:#fff;font-weight:700;font-size:13px}
  footer a{color:var(--lightblue);text-decoration:none}
  footer .ftag{font-style:italic;margin-top:8px;color:#8fb2da}
  /* ── Not found ── */
  .notfound{background:#fff;margin:26px 16px;padding:34px 24px;border-radius:16px;text-align:center;box-shadow:0 2px 10px rgba(13,43,94,.08)}
  .notfound h2{color:var(--navy);font-size:21px;margin-bottom:10px}
  .notfound p{color:var(--gray);font-size:15px;margin-bottom:20px}
</style>
</head>
<body>
  <div class="wrap" id="app" aria-live="polite"></div>

  <!-- Client data lives here — add a client to this file and the ?c= link just works. -->
  <script src="/clients.js"></script>
  <script>
  (function () {
    var PHONE_DISPLAY = "(240) 704-2551";
    var PHONE_TEL = "+12407042551";
    var app = document.getElementById("app");

    // ── tiny DOM helpers (textContent only — safe with hand-edited data) ──
    function el(tag, cls, text) {
      var n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    }

    // Brand logo — inline SVG (petal mark), works on navy.
    function logoSVG() {
      return '<svg class="logo" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
        + '<circle cx="24" cy="24" r="23" fill="#123566"/>'
        + '<path d="M24 9c3 4 3 8 0 11-3-3-3-7 0-11z" fill="#F0A500"/>'
        + '<path d="M39 24c-4 3-8 3-11 0 3-3 7-3 11 0z" fill="#4AACE8"/>'
        + '<path d="M24 39c-3-4-3-8 0-11 3 3 3 7 0 11z" fill="#1A6BAD"/>'
        + '<path d="M9 24c4-3 8-3 11 0-3 3-7 3-11 0z" fill="#4AACE8"/>'
        + '<circle cx="24" cy="24" r="4.4" fill="#fff"/></svg>';
    }

    function header() {
      var h = el("header");
      h.innerHTML =
        '<div class="brandrow">' + logoSVG() +
        '<div class="brandtext">' +
          '<div class="brandname">CAPITAL CLEAN &amp; CARE</div>' +
          '<div class="brandsub">Professional Cleaning Service</div>' +
        '</div></div>' +
        '<div class="tagline">More than clean. Care you can see.</div>' +
        '<span class="badge">Estimate</span>';
      return h;
    }

    function money(v) {
      // Accepts "$2,500.00", "2500", 2500, etc. Returns a display string.
      if (typeof v === "number") {
        return "$" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }
      var s = String(v).trim();
      return s.charAt(0) === "$" ? s : "$" + s;
    }

    function render(c) {
      app.appendChild(el("div", "topstripe"));
      app.appendChild(header());

      // Client block
      var cb = el("div", "client");
      cb.appendChild(el("div", "to", "Prepared for"));
      cb.appendChild(el("div", "name", c.name || ""));
      if (c.address) cb.appendChild(el("div", "addr", c.address));
      if (c.service) cb.appendChild(el("div", "service", c.service));
      app.appendChild(cb);

      // Total
      var t = el("div", "total");
      t.appendChild(el("div", "lbl", "Estimated Total"));
      t.appendChild(el("div", "val", money(c.total)));
      app.appendChild(t);

      // Sections (accordion)
      var sections = Array.isArray(c.sections) ? c.sections : [];
      if (sections.length) {
        var wrap = el("div", "sections");
        wrap.appendChild(el("div", "sechead", "What's Included — tap each area"));
        sections.forEach(function (sec, i) {
          var acc = el("div", "acc");
          var btn = el("button", "acc-btn");
          btn.type = "button";
          btn.setAttribute("aria-expanded", "false");
          btn.appendChild(el("span", null, sec.title || ("Section " + (i + 1))));
          var chev = el("span", "chev", "⌄"); // ⌄
          btn.appendChild(chev);
          var body = el("div", "acc-body");
          var inner = el("div", "acc-inner");
          (sec.items || []).forEach(function (it) {
            var row = el("div", "item");
            row.appendChild(el("span", "check", "✓")); // ✓
            row.appendChild(el("span", null, it));
            inner.appendChild(row);
          });
          body.appendChild(inner);
          acc.appendChild(btn);
          acc.appendChild(body);
          wrap.appendChild(acc);

          btn.addEventListener("click", function () {
            var isOpen = acc.classList.contains("open");
            // close all — one open at a time
            wrap.querySelectorAll(".acc.open").forEach(function (o) {
              o.classList.remove("open");
              o.querySelector(".acc-btn").setAttribute("aria-expanded", "false");
            });
            if (!isOpen) {
              acc.classList.add("open");
              btn.setAttribute("aria-expanded", "true");
            }
          });
        });
        app.appendChild(wrap);
      }

      // Trust chips
      var chips = el("div", "chips");
      ["All products provided", "Fully insured team", "100% Satisfaction"].forEach(function (label) {
        var chip = el("div", "chip");
        chip.appendChild(el("span", "dot"));
        chip.appendChild(el("span", null, label));
        chips.appendChild(chip);
      });
      app.appendChild(chips);

      // Actions
      var acts = el("div", "actions");
      var smsBody = "Hi Capital Clean & Care — I'd like to accept my estimate and book."
        + (c.name ? " (" + c.name + (c.address ? ", " + c.address : "") + ")" : "");
      var accept = el("a", "btn btn-primary", "Accept & Book");
      accept.href = "sms:" + PHONE_TEL + "?&body=" + encodeURIComponent(smsBody);
      var call = el("a", "btn btn-secondary", "Call / Text " + PHONE_DISPLAY);
      call.href = "tel:" + PHONE_TEL;
      acts.appendChild(accept);
      acts.appendChild(call);
      app.appendChild(acts);
      app.appendChild(el("div", "fineprint", "Questions? Text or call — we'll walk you through every line."));

      footerEl();
    }

    function footerEl() {
      var f = el("footer");
      f.innerHTML =
        '<div class="fbrand">Capital Clean &amp; Care LLC</div>' +
        '<div><a href="https://capitalcleancare.com">capitalcleancare.com</a> &middot; Silver Spring, MD 20906</div>' +
        '<div class="ftag">More than clean. Care you can see.</div>';
      app.appendChild(f);
    }

    function notFound() {
      app.appendChild(el("div", "topstripe"));
      app.appendChild(header());
      var nf = el("div", "notfound");
      nf.appendChild(el("h2", null, "Estimate not found"));
      nf.appendChild(el("p", null, "We couldn't find that estimate. Please get in touch and we'll sort it out right away."));
      var call = el("a", "btn btn-primary", "Call / Text " + PHONE_DISPLAY);
      call.href = "tel:" + PHONE_TEL;
      nf.appendChild(call);
      app.appendChild(nf);
      footerEl();
    }

    // ── Boot ──
    var id = new URLSearchParams(window.location.search).get("c");
    var db = window.CLIENTS || {};
    var client = id ? db[id.toLowerCase().trim()] : null;
    if (client) {
      document.title = (client.name ? client.name + " · " : "") + "Estimate · Capital Clean & Care";
      render(client);
    } else {
      notFound();
    }
  })();
  </script>
</body>
</html>
